<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Binker: your wealth, measured in bitcoin.">
  <meta name="color-scheme" content="light">
  <title>Binker</title>
  <style>
    :root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242824;background:#FAF9F6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:48px 20px;text-align:center}
    .word{font-size:44px;font-weight:750;letter-spacing:-1.6px;margin:0}
    h1{font-size:clamp(30px,6vw,40px);font-weight:600;letter-spacing:-1.2px;line-height:1.1;margin:18px 0 0}
    p{margin:0;color:#686E68;font-size:16px}
    footer{display:flex;justify-content:center;gap:20px;padding:24px 20px 32px;font-size:14px;color:#686E68}
    a{color:inherit;text-underline-offset:4px}
    a:focus-visible{outline:3px solid #3F5937;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <svg aria-hidden="true" width="112" height="112" viewBox="0 0 35 35"><rect width="35" height="35" rx="10" fill="#E2EAD9"/><g transform="translate(5 5) scale(1.0416666667)"><rect x="5" y="3" width="5" height="18" rx="2.5" fill="#242824"/><circle cx="14" cy="14" r="7" fill="#242824"/><circle cx="14" cy="14" r="2.5" fill="#E2EAD9"/></g></svg>
    <p class="word" aria-label="Binker" style="color:#242824">binker</p>
    <h1>Your wealth, in&nbsp;₿</h1>
    <p>Coming soon to the App Store</p>
  </main>
  <footer><a href="/privacy/">Privacy</a><a href="mailto:support@binker.app">Support</a></footer>
</body>
</html>
